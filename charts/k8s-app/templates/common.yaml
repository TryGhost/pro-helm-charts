---
{{- /*
Rendering entry point, adapted from bjw-s app-template 5.1.0
(templates/common.yaml, Apache-2.0). k8s-app adds two value fragments
before handing off to the common library:
  - the app-template default of nameOverride = release name
  - the hot-reload git-sync sidecar/init container and mounts (hotReload.*)
*/ -}}
{{- include "bjw-s.common.loader.init" . }}

{{- define "k8s-app.hardcodedValues" -}}
# Set the nameOverride based on the release name if no override has been set
{{ if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{ end }}
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "k8s-app.hardcodedValues" . | fromYaml) -}}

{{- /* Before the env fill and hotReload: the migrations Job copies the app's
container as declared, then gets the same injected env as every other
container. */ -}}
{{- if .Values.migrations.enabled }}
{{- $_ := mergeOverwrite .Values (include "k8s-app.migrations.values" . | fromYaml) -}}
{{- end }}

{{- /* The app-db-secrets Secret comes with the env that reads it. Before
hotReload, so the app's own containers get the credentials and the git-sync
containers it adds do not. */ -}}
{{- if and .Values.secretsInjection.enabled .Values.secretsInjection.database }}
{{- $_ := mergeOverwrite .Values (include "k8s-app.databaseEnv.values" . | fromYaml) -}}
{{- end }}

{{- if .Values.hotReload.enabled }}
{{- $_ := mergeOverwrite .Values (include "k8s-app.hotReload.values" . | fromYaml) -}}
{{- end }}

{{- /* After hotReload so the git-sync sidecar's own env is respected too */ -}}
{{- $_ := mergeOverwrite .Values (include "k8s-app.envInjection.values" . | fromYaml) -}}

{{- $_ := mergeOverwrite .Values (include "k8s-app.controllerDefaults.values" . | fromYaml) -}}

{{- /* A dedicated Gateway is a DO load balancer per release: refuse it on
per-PR preview releases before filling each route's parentRefs. */ -}}
{{- if and .Values.preview.prNumber (ne (include "k8s-app.gateway.dedicatedNetworks" .) "[]") -}}
  {{- fail "previews must use a shared gateway: a dedicated Gateway is a load balancer per release" -}}
{{- end -}}
{{- $_ := include "k8s-app.gateway.applyRouteDefaults" . -}}

{{/* Render the templates */}}
{{ include "bjw-s.common.loader.generate" . }}
