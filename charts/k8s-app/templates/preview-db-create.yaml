{{- /*
Replaces the k8s repo's components/db-previews create-preview-db Job.
Creates the preview's database. Deliberately NOT a PreSync hook: the job
reads credentials from the app-db-secrets Secret, which the app-db-secrets
ExternalSecret (sync-wave -1) only materializes during the main sync — a
PreSync hook would deadlock on a fresh namespace waiting for a Secret the
sync hasn't applied yet. This job runs in wave 0 with the workloads, after
the ExternalSecret reports Ready; the app's migrate initContainer retries
until the database exists. CREATE IF NOT EXISTS is idempotent; an unchanged
Job manifest is a no-op on re-syncs. Jobs are immutable — even kubectl
replace fails because the live Job carries a server-generated
controller-uid selector — so spec changes need delete+recreate:
Force=true,Replace=true.
*/ -}}
{{- if .Values.previewDatabase.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "k8s-app.previewDatabase.jobName" (dict "Release" .Release "suffix" "create-preview-db") }}
  labels:
    {{- include "k8s-app.labels" . | nindent 4 }}
  annotations:
    # Wave 0: with the workloads, after the wave -1 ExternalSecret is Ready
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: {{ .Values.previewDatabase.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.previewDatabase.ttlSecondsAfterFinished }}
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create
          image: {{ include "k8s-app.previewDatabase.image" . }}
          {{- with .Values.previewDatabase.resources }}
          resources: {{ toJson . }}
          {{- end }}
          env:
            {{- include "k8s-app.previewDatabase.env" . | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -eu
              case "$GITHUB_PR_NUMBER" in '' | *[!0-9]*) echo "bad GITHUB_PR_NUMBER: $GITHUB_PR_NUMBER" >&2; exit 1;; esac
              mysql -h"$DB_HOST" -P"$DB_PORT" -u"$DB_USER" -p"$DB_PASS" \
                -e "CREATE DATABASE IF NOT EXISTS \`${APP_NAME}_preview_${GITHUB_PR_NUMBER}\` CHARACTER SET utf8mb4"
              echo "created ${APP_NAME}_preview_${GITHUB_PR_NUMBER}"
{{- end }}
