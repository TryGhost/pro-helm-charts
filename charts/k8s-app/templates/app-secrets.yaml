{{- /*
Replaces the k8s repo's components/app-secrets Kustomize component.
Pulls every Secret Manager secret named <release namespace>_<key> and labeled
namespace=<release namespace> into the app-secrets Secret, one key per GCP
secret, as <release namespace>-<key>. Only the namespace's owning teams can
create secrets with that prefix (IAM condition on the name, from the k8s
repo's teams.yaml). While the migration entry below is rendered, a label alone
still moves any secret into the namespace; the name prefix protects it only
once that entry is dropped. Each cluster's
ClusterSecretStore points at its environment's GCP project, so no env
filtering is needed — but production and supporting share a project, so
secrets there must be unambiguous by namespace.

Workloads still map keys explicitly (env / envFrom / persistence); creating
this ExternalSecret injects nothing into any container by itself.
*/ -}}
{{- if .Values.secretsInjection.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  labels:
    {{- include "k8s-app.labels" . | nindent 4 }}
  annotations:
    # Wave -10: the Secrets must exist (ES Ready) before anything reads them
    argocd.argoproj.io/sync-wave: "-10"
    # Namespace-shared infrastructure, consumed by every release in the
    # namespace: previews bootstrap these ExternalSecrets and the staging
    # release later co-manages/adopts them. Prune=false means disabling
    # secretsInjection orphans them instead of deleting; Delete=false means
    # Application deletion (PR preview close) leaves them in place — the same
    # convention as addon Namespaces.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: {{ .Values.secretsInjection.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secretsInjection.store.kind }}
    name: {{ .Values.secretsInjection.store.name }}
  target:
    name: app-secrets
  dataFrom:
    # Migration: every labelled secret, until every app secret is renamed to
    # <namespace>_<key>; then drop this entry. It matches the prefixed copies
    # too (ESO's GCP provider ignores tags when name is set, so they can't be
    # excluded), so it applies the same rewrite: no <namespace>_ keys leak
    # through. An original and its copy map to the same key; the next entry
    # always wins, so the copy's value is used. Delete each original once its
    # copy exists.
    - find:
        # Stated explicitly (ESO defaults them) so ArgoCD does not see drift
        conversionStrategy: Default
        decodingStrategy: None
        tags:
          namespace: {{ .Release.Namespace | quote }}
      rewrite:
        - regexp:
            source: "^{{ .Release.Namespace }}_"
            target: "{{ .Release.Namespace }}-"
    - find:
        conversionStrategy: Default
        decodingStrategy: None
        path: {{ printf "%s_" .Release.Namespace | quote }}
        tags:
          namespace: {{ .Release.Namespace | quote }}
      rewrite:
        # Keys keep the <namespace>-<key> names apps already reference
        - regexp:
            source: "^{{ .Release.Namespace }}_"
            target: "{{ .Release.Namespace }}-"
{{- end }}
