{{- /*
Replaces the k8s repo's components/app-db-secrets Kustomize component.
Terraform's do-mysql module writes ONE Secret Manager secret per database
cluster, named <env>-<app>db (e.g. stg-schedulerdb) and labeled
namespace=<app>. Its payload is a JSON object (host, private_host, port,
user, password, database, uri, private_uri, ssl_ca). The ESO template below
explodes it into plain keys in the app-db-secrets Secret.

The {{ "{{ ... }}" }} expressions inside target.template are for External
Secrets Operator to evaluate, not Helm; "k8s-app.esoField" emits them
escaped.
*/ -}}
{{- if and .Values.secretsInjection.enabled .Values.secretsInjection.database }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-secrets
  labels:
    {{- include "k8s-app.labels" . | nindent 4 }}
  annotations:
    # Wave -1: the Secret must exist (ES Ready) before wave-0 consumers start
    argocd.argoproj.io/sync-wave: "-1"
    # Namespace-shared infrastructure, consumed by every release in the
    # namespace: previews bootstrap these ExternalSecrets and the staging
    # release later co-manages/adopts them. Prune=false means disabling
    # secretsInjection orphans them instead of deleting; Delete=false means
    # Application deletion (PR preview close) leaves them in place — the same
    # convention as addon Namespaces.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: {{ .Values.secretsInjection.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secretsInjection.store.kind }}
    name: {{ .Values.secretsInjection.store.name }}
  dataFrom:
    - find:
        name:
          regexp: "^(stg|prd)-.+db$"
        tags:
          namespace: {{ .Release.Namespace }}
        # Stated explicitly (ESO defaults them) so ArgoCD does not see drift
        conversionStrategy: Default
        decodingStrategy: None
      # Normalise "<env>-<app>db" to "db" so the template below is the same
      # for every app. Exactly one secret must match; two would collide.
      rewrite:
        - regexp:
            source: "^(stg|prd)-.+db$"
            target: "db"
  target:
    name: app-db-secrets
    # Explode the JSON into one key per field. The template replaces the
    # fetched data, so the raw blob is not written to the Secret.
    template:
      engineVersion: v2
      data:
        # VPC hostname: workloads run in the same DO VPC as the cluster.
        host: {{ include "k8s-app.esoField" "private_host" }}
        public_host: {{ include "k8s-app.esoField" "host" }}
        port: {{ include "k8s-app.esoField" "port" }}
        user: {{ include "k8s-app.esoField" "user" }}
        password: {{ include "k8s-app.esoField" "password" }}
        # DO's default database (defaultdb) — apps normally set their own.
        database: {{ include "k8s-app.esoField" "database" }}
        uri: {{ include "k8s-app.esoField" "private_uri" }}
        public_uri: {{ include "k8s-app.esoField" "uri" }}
        # Cluster CA certificate (PEM); DO managed MySQL requires TLS.
        ssl_ca: {{ include "k8s-app.esoField" "ssl_ca" }}
{{- end }}
