configMaps:
  config:
    data:
      NODE_ENV: staging

controllers:
  main:
    containers:
      main:
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 1Gi

route:
  main:
    hostnames:
      - myapp.ghostinfra.net

monitoring:
  alerts:
    MyappHighErrorRate:
      labels:
        severity: warning
  slos:
    availability:
      alerting:
        severities:
          fastBurn: warning
          mediumBurn: warning
          absent: warning

network:
  allow:
    database:
      host: private-myapp-stg-db.b.db.ondigitalocean.com
      ports: [25060]
    sites:
      preset: sitesdbs
