# https://github.com/TryGhost/pro-helm-charts

secretsInjection:
  enabled: true
  database: true

configMaps:
  config:
    data:
      db__client: mysql2
      db__connection__charset: utf8mb4
      db__connection__database: myapp

controllers:
  main:
    containers:
      main:
        # __IMAGE_SHA__ is filled by gitops-sync when snapshotting to k8s gitops repo
        image: &image
          repository: registry.digitalocean.com/ghost/myapp
          tag: __IMAGE_SHA__
        command:
          - node
          - src/main.js
        envFrom: &envFrom
          - configMapRef:
              identifier: config
        env: &env
          db__connection__host:
            valueFrom:
              secretKeyRef:
                name: app-db-secrets
                key: host
          db__connection__port:
            valueFrom:
              secretKeyRef:
                name: app-db-secrets
                key: port
          db__connection__user:
            valueFrom:
              secretKeyRef:
                name: app-db-secrets
                key: user
          db__connection__password:
            valueFrom:
              secretKeyRef:
                name: app-db-secrets
                key: password
          db__connection__ssl__ca:
            valueFrom:
              secretKeyRef:
                name: app-db-secrets
                key: ssl_ca
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 3000
              initialDelaySeconds: 5
              periodSeconds: 2
              failureThreshold: 30
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 3000
              periodSeconds: 15
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 3000
              periodSeconds: 15
    initContainers:
      migrate:
        image: *image
        command:
          - ./node_modules/.bin/knex
          - migrate:latest
        envFrom: *envFrom
        env: *env

service:
  main:
    controller: main
    ports:
      http:
        port: 3000

# No route here: environments that expose the app declare it with hostnames;
# the chart attaches it to the shared internal gateway unless the route
# selects another with `gateway:` (see the chart README).
