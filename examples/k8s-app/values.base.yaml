# https://github.com/TryGhost/pro-helm-charts

secretsInjection:
  enabled: true
  database: true

# Runs in the app's own image, at sync-wave -1: after the (preview) database
# exists and before the Deployment rolls.
migrations:
  enabled: true
  command:
    - ./node_modules/.bin/knex
    - migrate:latest

# secretsInjection.database also fills db__connection__host and friends from
# the app-db-secrets Secret, so the ConfigMap below only carries the app's own
# settings (each environment adds NODE_ENV).
configMaps:
  config:
    data:
      LOG_LEVEL: info

controllers:
  main:
    containers:
      main:
        # __IMAGE_SHA__ is filled by gitops-sync when snapshotting to k8s gitops repo
        image:
          repository: registry.digitalocean.com/ghost/myapp
          tag: __IMAGE_SHA__
        command:
          - node
          - src/main.js
        envFrom:
          - configMapRef:
              identifier: config
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 3000
              initialDelaySeconds: 5
              periodSeconds: 2
              failureThreshold: 30
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 3000
              periodSeconds: 15
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 3000
              periodSeconds: 15

service:
  main:
    controller: main
    ports:
      http:
        port: 3000

# No route here: environments that expose the app declare it with hostnames;
# the chart attaches it to the shared internal gateway unless the route
# selects another with `gateway:` (see the chart README).

# Not rendered on previews. An environment can override one entry, e.g.
# monitoring.alerts.MyappHighErrorRate.enabled: false in values.staging.yaml.
monitoring:
  alerts:
    MyappHighErrorRate:
      expr: |
        sum(rate(http_requests_total{namespace="myapp",code=~"5.."}[5m]))
          / sum(rate(http_requests_total{namespace="myapp"}[5m])) > 0.05
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: myapp is serving {{ $value | humanizePercentage }} 5xx
  slos:
    availability:
      description: Requests served without a 5xx
      target: "99.9"
      indicator:
        ratio:
          errors:
            metric: http_requests_total{namespace="myapp",code=~"5.."}
          total:
            metric: http_requests_total{namespace="myapp"}
