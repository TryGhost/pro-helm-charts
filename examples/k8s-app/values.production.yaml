configMaps:
  config:
    data:
      NODE_ENV: production

controllers:
  main:
    containers:
      main:
        resources:
          requests:
            cpu: 1
            memory: 512Mi
          limits:
            cpu: 4
            memory: 2Gi

route:
  main:
    hostnames:
      - myapp.ghostinfra.com

network:
  allow:
    database:
      host: private-myapp-db.a.db.ondigitalocean.com
      ports: [25060]
    redis:
      ip: 10.133.0.12
      ports: [6379, 26379]
