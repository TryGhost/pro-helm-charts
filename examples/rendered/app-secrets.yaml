---
# Source: k8s-app/templates/common.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  labels:
    app.kubernetes.io/instance: app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: app
  namespace: app
---
# Source: k8s-app/templates/common.yaml
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app.kubernetes.io/instance: app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: app
    app.kubernetes.io/service: app
  namespace: app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: app
    app.kubernetes.io/name: app
---
# Source: k8s-app/templates/common.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: app
  namespace: app
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: app
      app.kubernetes.io/instance: app
  template:
    metadata:
      labels: 
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: app
        app.kubernetes.io/name: app
    spec: 
      enableServiceLinks: false
      serviceAccountName: app
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      imagePullSecrets: 
        - name: ghost
      containers: 
        - env:
          - name: API_TOKEN
            valueFrom:
              secretKeyRef:
                key: example-api-token
                name: app-secrets
          - name: APP_NAME
            value: app
          - name: GITHUB_PR_NUMBER
            value: ""
          image: nginx:1.27.0
          name: main
---
# Source: k8s-app/templates/app-secrets.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/instance: app
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Wave -1: the Secret must exist (ES Ready) before wave-0 consumers start
    argocd.argoproj.io/sync-wave: "-1"
    # Namespace-shared infrastructure, consumed by every release in the
    # namespace: previews bootstrap these ExternalSecrets and the staging
    # release later co-manages/adopts them. Prune=false means disabling
    # secretsInjection orphans them instead of deleting; Delete=false means
    # Application deletion (PR preview close) leaves them in place — the same
    # convention as addon Namespaces.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secrets-manager
  target:
    name: app-secrets
  dataFrom:
    - find:
        # Stated explicitly (ESO defaults them) so ArgoCD does not see drift
        conversionStrategy: Default
        decodingStrategy: None
        tags:
          namespace: app
