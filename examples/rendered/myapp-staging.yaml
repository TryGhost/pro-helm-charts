apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: myapp
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: myapp
  namespace: myapp
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: myapp
      app.kubernetes.io/instance: myapp
  template:
    metadata:
      annotations: 
        checksum/configMaps: 45f2c8441886c566d4ceec332dcaf9b789160ecf5a09251ff016f68cdc2b5316
      labels: 
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: myapp
        app.kubernetes.io/name: myapp
    spec: 
      enableServiceLinks: false
      serviceAccountName: myapp
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      imagePullSecrets: 
        - name: ghost
      initContainers: 
        - command:
          - ./node_modules/.bin/knex
          - migrate:latest
          env:
          - name: APP_NAME
            value: myapp
          - name: GITHUB_PR_NUMBER
            value: ""
          - name: db__connection__host
            valueFrom:
              secretKeyRef:
                key: host
                name: app-db-secrets
          - name: db__connection__password
            valueFrom:
              secretKeyRef:
                key: password
                name: app-db-secrets
          - name: db__connection__port
            valueFrom:
              secretKeyRef:
                key: port
                name: app-db-secrets
          - name: db__connection__ssl__ca
            valueFrom:
              secretKeyRef:
                key: ssl_ca
                name: app-db-secrets
          - name: db__connection__user
            valueFrom:
              secretKeyRef:
                key: user
                name: app-db-secrets
          envFrom:
          - configMapRef:
              name: myapp
          image: registry.digitalocean.com/ghost/myapp:__IMAGE_SHA__
          name: migrate
      containers: 
        - command:
          - node
          - src/main.js
          env:
          - name: APP_NAME
            value: myapp
          - name: GITHUB_PR_NUMBER
            value: ""
          - name: db__connection__host
            valueFrom:
              secretKeyRef:
                key: host
                name: app-db-secrets
          - name: db__connection__password
            valueFrom:
              secretKeyRef:
                key: password
                name: app-db-secrets
          - name: db__connection__port
            valueFrom:
              secretKeyRef:
                key: port
                name: app-db-secrets
          - name: db__connection__ssl__ca
            valueFrom:
              secretKeyRef:
                key: ssl_ca
                name: app-db-secrets
          - name: db__connection__user
            valueFrom:
              secretKeyRef:
                key: user
                name: app-db-secrets
          envFrom:
          - configMapRef:
              name: myapp
          image: registry.digitalocean.com/ghost/myapp:__IMAGE_SHA__
          livenessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 15
          name: main
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 15
          resources:
            limits:
              cpu: 1
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 2
