---
# Source: k8s-app/templates/common.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  labels:
    app.kubernetes.io/instance: app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: app
  namespace: app
---
# Source: k8s-app/templates/common.yaml
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app.kubernetes.io/instance: app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: app
    app.kubernetes.io/service: app
  namespace: app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: app
    app.kubernetes.io/name: app
---
# Source: k8s-app/templates/common.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: app
  namespace: app
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: app
      app.kubernetes.io/instance: app
  template:
    metadata:
      labels: 
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: app
        app.kubernetes.io/name: app
    spec: 
      enableServiceLinks: false
      serviceAccountName: app
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      imagePullSecrets: 
        - name: ghost
      containers: 
        - env:
          - name: APP_NAME
            value: app
          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                key: host
                name: app-db-secrets
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: app-db-secrets
          - name: GITHUB_PR_NUMBER
            value: ""
          image: nginx:1.27.0
          name: main
---
# Source: k8s-app/templates/app-db-secrets.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-db-secrets
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/instance: app
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Wave -1: the Secret must exist (ES Ready) before wave-0 consumers start
    argocd.argoproj.io/sync-wave: "-1"
    # Namespace-shared infrastructure, consumed by every release in the
    # namespace: previews bootstrap these ExternalSecrets and the staging
    # release later co-manages/adopts them. Prune=false means disabling
    # secretsInjection orphans them instead of deleting; Delete=false means
    # Application deletion (PR preview close) leaves them in place — the same
    # convention as addon Namespaces.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secrets-manager
  dataFrom:
    - find:
        name:
          regexp: "^(stg|prd)-.+db$"
        tags:
          namespace: app
        # Stated explicitly (ESO defaults them) so ArgoCD does not see drift
        conversionStrategy: Default
        decodingStrategy: None
      # Normalise "<env>-<app>db" to "db" so the template below is the same
      # for every app. Exactly one secret must match; two would collide.
      rewrite:
        - regexp:
            source: "^(stg|prd)-.+db$"
            target: "db"
  target:
    name: app-db-secrets
    # Explode the JSON into one key per field. The template replaces the
    # fetched data, so the raw blob is not written to the Secret.
    template:
      engineVersion: v2
      data:
        # VPC hostname: workloads run in the same DO VPC as the cluster.
        host: '{{ (.db | fromJson).private_host }}'
        public_host: '{{ (.db | fromJson).host }}'
        port: '{{ (.db | fromJson).port }}'
        user: '{{ (.db | fromJson).user }}'
        password: '{{ (.db | fromJson).password }}'
        # DO's default database (defaultdb) — apps normally set their own.
        database: '{{ (.db | fromJson).database }}'
        uri: '{{ (.db | fromJson).private_uri }}'
        public_uri: '{{ (.db | fromJson).uri }}'
        # Cluster CA certificate (PEM); DO managed MySQL requires TLS.
        ssl_ca: '{{ (.db | fromJson).ssl_ca }}'
---
# Source: k8s-app/templates/app-secrets.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/instance: app
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Wave -1: the Secret must exist (ES Ready) before wave-0 consumers start
    argocd.argoproj.io/sync-wave: "-1"
    # Namespace-shared infrastructure, consumed by every release in the
    # namespace: previews bootstrap these ExternalSecrets and the staging
    # release later co-manages/adopts them. Prune=false means disabling
    # secretsInjection orphans them instead of deleting; Delete=false means
    # Application deletion (PR preview close) leaves them in place — the same
    # convention as addon Namespaces.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secrets-manager
  target:
    name: app-secrets
  dataFrom:
    - find:
        # Stated explicitly (ESO defaults them) so ArgoCD does not see drift
        conversionStrategy: Default
        decodingStrategy: None
        tags:
          namespace: app
