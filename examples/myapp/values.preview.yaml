# Point the app and its migrations at the per-PR database (name assembled
# from the namespace + the pull-request label the ApplicationSet stamps).
# Credentials stay the cluster user from app-db-secrets — only the database
# name differs from staging. ghost-app injects APP_NAME and GITHUB_PR_NUMBER
# into every container; they sort before db__* so the $() expansion works.
controllers:
  main:
    containers:
      main:
        env: &previewDb
          db__connection__database: $(APP_NAME)_preview_$(GITHUB_PR_NUMBER)
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 1Gi
    initContainers:
      migrate:
        env: *previewDb

# gitops-sync substitutes __PR_NUMBER__ when snapshotting the preview branch;
# the staging cluster's wildcard *.ghostinfra.net cert covers the host and
# external-dns publishes it against the shared internal gateway's LB.
route:
  main:
    enabled: true
    hostnames:
      - myapp-__PR_NUMBER__.ghostinfra.net

# Hot reload: replaces values.hot-reload.yaml. The chart adds the git-sync
# init container + sidecar, the /workspace emptyDir, the pinned known_hosts
# ConfigMap and the SSH-key-only Secret projection, and runs `pnpm dev`
# (nodemon, --legacy-watch) against the synced checkout.
# Repository and ref come from the pod at runtime: the pull-request
# ApplicationSet stamps the ghost.org/git-repo annotation and the pull-request
# label on every preview pod.
hotReload:
  enabled: true

# Per-PR database: replaces the k8s repo's components/db-previews component.
# Creates myapp_preview_<pr> in wave 0 and drops it on Application delete.
previewDatabase:
  enabled: true
