# App with the app-secrets ExternalSecret. Keys are still mapped explicitly;
# enabling secretsInjection does not inject anything by itself.
secretsInjection:
  enabled: true

controllers:
  main:
    containers:
      main:
        image:
          repository: nginx
          tag: 1.27.0
        env:
          API_TOKEN:
            valueFrom:
              secretKeyRef:
                name: app-secrets
                key: example-api-token
service:
  main:
    controller: main
    ports:
      http:
        port: 80
