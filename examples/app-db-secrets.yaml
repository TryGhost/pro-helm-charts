# App with both app-secrets and app-db-secrets ExternalSecrets.
secretsInjection:
  enabled: true
  database: true

controllers:
  main:
    containers:
      main:
        image:
          repository: nginx
          tag: 1.27.0
        env:
          DB_HOST:
            valueFrom:
              secretKeyRef:
                name: app-db-secrets
                key: host
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: app-db-secrets
                key: password
service:
  main:
    controller: main
    ports:
      http:
        port: 80
