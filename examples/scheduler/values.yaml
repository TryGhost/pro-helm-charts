# Scheduler base values for ghost-app (proposed .k8s/base/values.yaml).
# Identical to the app-template values, plus secretsInjection, which replaces
# the two Kustomize component references (components/app-secrets and
# components/app-db-secrets) that used to sit in .k8s/base/kustomization.yaml.
secretsInjection:
  enabled: true
  database: true

controllers:
  main:
    containers:
      main:
        # Bumped by .github/workflows/build.yml on each push to main.
        image: &image
          repository: registry.digitalocean.com/ghost/scheduler
          tag: latest
        command:
          - node
          - src/main.js
        envFrom: &envFrom
          - configMapRef:
              identifier: config
        env: &env
          # Explicit mappings: the app-db-secrets Secret (app-db-secrets, exploded
          # from Terraform's <env>-schedulerdb GCP secret) uses plain field
          # names, not the nconf env var names, so envFrom on the Secret can't
          # be used. The database name is not in the GCP secret (the cluster
          # only knows DO's defaultdb) — it comes from the config ConfigMap;
          # env entries here take precedence over envFrom.
          db__connection__host:
            valueFrom:
              secretKeyRef:
                name: app-db-secrets
                key: host
          db__connection__port:
            valueFrom:
              secretKeyRef:
                name: app-db-secrets
                key: port
          db__connection__user:
            valueFrom:
              secretKeyRef:
                name: app-db-secrets
                key: user
          db__connection__password:
            valueFrom:
              secretKeyRef:
                name: app-db-secrets
                key: password
          # DO managed MySQL requires TLS; mysql2 takes `ssl: { ca }`.
          db__connection__ssl__ca:
            valueFrom:
              secretKeyRef:
                name: app-db-secrets
                key: ssl_ca
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 3000
              periodSeconds: 15
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 3000
              periodSeconds: 5
    initContainers:
      # Run pending knex migrations before the app starts, same as the
      # docker-compose dev flow (pnpm migrate:latest && pnpm start).
      migrate:
        image: *image
        # pnpm .bin entries are shell shims, not JS — exec directly, not via node
        command:
          - ./node_modules/.bin/knex
          - migrate:latest
        envFrom: *envFrom
        env: *env

configMaps:
  config:
    data:
      NODE_ENV: production
      db__client: mysql2
      db__connection__charset: utf8mb4
      db__connection__database: scheduler

service:
  main:
    controller: main
    ports:
      http:
        port: 3000

# Internal endpoint: attaches to the cluster's shared internal Gateway (a
# VPC-only DO load balancer, created by terraform's do-k8s module). Disabled
# here so previews don't attach a hostname-less catch-all route — each
# environment enables it with its own hostname. external-dns publishes the
# hostname; the gateway's wildcard cert covers it.
route:
  main:
    enabled: false
    parentRefs:
      - name: shared-internal-gateway
        namespace: default
        sectionName: https
