# Lint, render and check the charts. Runs on every PR and push to main, and is
# reused by release.yaml so nothing is published that did not pass.
#
# Rendering proves the templates produce the expected manifests; it does not
# prove the workloads run. See README "Validation".
name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CHART: charts/ghost-app
  # Pinned so local and CI results match; Renovate does not manage this line.
  HELM_VERSION: v4.1.4

jobs:
  lint-and-render:
    name: Lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Build dependencies from Chart.lock
        run: |
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
          # Fails if Chart.yaml and Chart.lock disagree (run `helm dependency update` and commit the lock)
          helm dependency build "$CHART"
          ls "$CHART/charts"

      - name: Check values.schema.json is common's schema plus our extensions
        run: |
          archive=$(ls "$CHART"/charts/common-*.tgz)
          tar -xzOf "$archive" common/values.schema.json \
            | jq --slurpfile ext "$CHART/schemas/ghost-app.json" '
                .["$id"] = "https://github.com/TryGhost/pro-helm-charts/blob/main/charts/ghost-app/values.schema.json"
                | .title = "ghost-app values"
                | .description = "bjw-s common library values (embedded verbatim from the locked common dependency) plus the options ghost-app adds: secretsInjection, hotReload and previewDatabase."
                | .properties += $ext[0]' > /tmp/expected.schema.json
          if ! diff -q /tmp/expected.schema.json "$CHART/values.schema.json"; then
            echo "::error::values.schema.json is stale. Regenerate it with the command in README.md (Updating common) and commit." >&2
            exit 1
          fi

      - name: Lint with every example
        run: |
          set -x
          helm lint --strict "$CHART"
          for f in examples/minimal.yaml examples/app-secrets.yaml examples/app-db-secrets.yaml; do
            helm lint --strict "$CHART" -f "$f"
          done
          for env in staging production preview; do
            helm lint --strict "$CHART" -f examples/myapp/values.yaml -f "examples/myapp/values.$env.yaml"
          done

      - name: Schema rejects invalid values
        run: |
          set -x
          ! helm template t "$CHART" -f examples/minimal.yaml --set secretsInjection.bogus=1
          ! helm template t "$CHART" -f examples/minimal.yaml --set secretsInjection.store.kind=Nope
          ! helm template t "$CHART" -f examples/minimal.yaml --set hotReload.enabled=true --set hotReload.controller=nope  # unknown controller
          ! helm template t "$CHART" -f examples/minimal.yaml --set controllers.main.bogus=1  # bjw-s schema still applies
          ! helm template t "$CHART" -f examples/minimal.yaml --set previewDatabase.bogus=1
          ! helm template t "$CHART" -f examples/minimal.yaml --set previewDatabase.backoffLimit=-1

      - name: Render examples
        run: |
          mkdir -p out
          helm template app "$CHART" -n app -f examples/minimal.yaml        > out/minimal.yaml
          helm template app "$CHART" -n app -f examples/app-secrets.yaml    > out/app-secrets.yaml
          helm template app "$CHART" -n app -f examples/app-db-secrets.yaml > out/app-db-secrets.yaml
          for env in staging production preview; do
            helm template myapp "$CHART" -n myapp \
              -f examples/myapp/values.yaml -f "examples/myapp/values.$env.yaml" > "out/myapp-$env.yaml"
          done

      - name: Check secret injection rendering
        run: |
          set -euo pipefail
          kinds() { yq -N '.kind + "/" + .metadata.name' "$1" | sort; }

          echo "minimal: no ExternalSecret"
          ! grep -q 'kind: ExternalSecret' out/minimal.yaml
          [ "$(kinds out/minimal.yaml)" = "$(printf 'Deployment/app\nService/app\nServiceAccount/app')" ]

          echo "app-secrets: only app-secrets"
          [ "$(yq -N 'select(.kind=="ExternalSecret") | .metadata.name' out/app-secrets.yaml)" = "app-secrets" ]
          es=$(yq 'select(.kind=="ExternalSecret" and .metadata.name=="app-secrets")' out/app-secrets.yaml)
          [ "$(yq '.spec.target.name' <<<"$es")" = "app-secrets" ]
          [ "$(yq '.spec.refreshInterval' <<<"$es")" = "5m" ]
          [ "$(yq '.spec.secretStoreRef.kind + "/" + .spec.secretStoreRef.name' <<<"$es")" = "ClusterSecretStore/gcp-secrets-manager" ]
          [ "$(yq '.spec.dataFrom[0].find.tags.namespace' <<<"$es")" = "app" ]
          [ "$(yq '.metadata.annotations["argocd.argoproj.io/sync-wave"]' <<<"$es")" = "-1" ]

          echo "app-db-secrets: both, JSON exploded with ESO expressions intact"
          [ "$(yq -N 'select(.kind=="ExternalSecret") | .metadata.name' out/app-db-secrets.yaml | sort | tr '\n' ' ')" = "app-db-secrets app-secrets " ]
          db=$(yq 'select(.kind=="ExternalSecret" and .metadata.name=="app-db-secrets")' out/app-db-secrets.yaml)
          [ "$(yq '.spec.target.name' <<<"$db")" = "app-db-secrets" ]
          [ "$(yq '.spec.refreshInterval' <<<"$db")" = "5m" ]
          [ "$(yq '.spec.dataFrom[0].find.tags.namespace' <<<"$db")" = "app" ]
          [ "$(yq '.spec.dataFrom[0].find.name.regexp' <<<"$db")" = '^(stg|prd)-.+db$' ]
          [ "$(yq '.spec.dataFrom[0].rewrite[0].regexp.target' <<<"$db")" = "db" ]
          [ "$(yq '.spec.target.template.engineVersion' <<<"$db")" = "v2" ]
          [ "$(yq '.spec.target.template.data.host' <<<"$db")" = '{{ (.db | fromJson).private_host }}' ]
          [ "$(yq '.spec.target.template.data.uri' <<<"$db")" = '{{ (.db | fromJson).private_uri }}' ]
          [ "$(yq '.spec.target.template.data | keys | sort | join(" ")' <<<"$db")" = "database host password port public_host public_uri ssl_ca uri user" ]
          [ "$(yq '.metadata.annotations["argocd.argoproj.io/sync-wave"]' <<<"$db")" = "-1" ]

          echo "no placeholder or database secret without master switch"
          ! grep -rq REPLACED-BY-KUSTOMIZE out/
          ! helm template t "$CHART" -f examples/minimal.yaml --set secretsInjection.database=true | grep -q 'kind: ExternalSecret'

          echo "no secrets are injected implicitly"
          [ "$(yq 'select(.kind=="Deployment") | .spec.template.spec.containers[0].envFrom' out/app-secrets.yaml)" = "null" ]
          [ "$(yq 'select(.kind=="Deployment") | .spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name' out/app-secrets.yaml)" = "app-secrets" ]

      - name: Check full-app rendering
        run: |
          set -euo pipefail
          for env in staging production; do
            f="out/myapp-$env.yaml"
            [ "$(yq -N 'select(.kind=="ExternalSecret") | .spec.dataFrom[0].find.tags.namespace' "$f" | sort -u)" = "myapp" ]
            [ "$(yq 'select(.kind=="Deployment") | .spec.template.spec.containers | length' "$f")" = "1" ]
            [ "$(yq 'select(.kind=="Deployment") | .spec.template.spec.containers[0].command | join(" ")' "$f")" = "node src/main.js" ]
            [ "$(yq 'select(.kind=="Deployment") | .spec.template.spec.initContainers[0].name' "$f")" = "migrate" ]
            [ "$(yq 'select(.kind=="Deployment") | .spec.template.spec.containers[0].env[] | select(.name=="db__connection__host") | .valueFrom.secretKeyRef.name' "$f")" = "app-db-secrets" ]
            ! grep -q git-sync "$f"
          done

          echo "preview: hot reload"
          f=out/myapp-preview.yaml
          dep=$(yq 'select(.kind=="Deployment")' "$f")
          [ "$(yq '.spec.template.spec.initContainers[].name' <<<"$dep" | tr '\n' ' ')" = "git-sync-init migrate " ]
          [ "$(yq '.spec.template.spec.containers[].name' <<<"$dep" | tr '\n' ' ')" = "git-sync main " ]
          [ "$(yq '.spec.template.spec.securityContext.fsGroup' <<<"$dep")" = "65533" ]
          gs=$(yq '.spec.template.spec.containers[] | select(.name=="git-sync")' <<<"$dep")
          # expected image comes from the chart defaults so Renovate bumps don't break this
          [ "$(yq '.image' <<<"$gs")" = "$(yq '.hotReload.gitSync.image.repository + ":" + .hotReload.gitSync.image.tag' "$CHART/values.yaml")" ]
          yq '.args[]' <<<"$gs" | grep -cx -- '--period=2s'
          ! yq '.args[]' <<<"$gs" | grep -c -- '--repo='
          [ "$(yq '.env[] | select(.name=="GITSYNC_REPO") | .valueFrom.fieldRef.fieldPath' <<<"$gs")" = "metadata.annotations['ghost.org/git-repo']" ]
          [ "$(yq '.env[] | select(.name=="GITSYNC_REF") | .value' <<<"$gs")" = 'refs/pull/$(GITHUB_PR_NUMBER)/head' ]
          [ "$(yq '.env[] | select(.name=="GITHUB_PR_NUMBER") | .valueFrom.fieldRef.fieldPath' <<<"$gs")" = "metadata.labels['pull-request']" ]
          ! yq '.args[]' <<<"$gs" | grep -c -- '--ref='
          # kubelet only expands $(VAR) for vars defined earlier; bjw-s sorts env alphabetically
          [ "$(yq '.env[].name' <<<"$gs" | tr '\n' ' ')" = "APP_NAME GITHUB_PR_NUMBER GITSYNC_REF GITSYNC_REPO " ]
          echo "explicit repo/ref override"
          ov=$(helm template myapp "$CHART" -n myapp -f examples/myapp/values.yaml -f examples/myapp/values.preview.yaml --set hotReload.repo=git@github.com:TryGhost/Daisy.js.git --set hotReload.ref=refs/heads/main | yq 'select(.kind=="Deployment") | .spec.template.spec.containers[] | select(.name=="git-sync")')
          yq '.args[]' <<<"$ov" | grep -cx -- '--repo=git@github.com:TryGhost/Daisy.js.git'
          [ "$(yq '.env[] | select(.name=="GITSYNC_REPO") | .name' <<<"$ov")" = "" ]
          [ "$(yq '.env[] | select(.name=="GITSYNC_REF") | .value' <<<"$ov")" = "refs/heads/main" ]
          yq '.args[]' <<<"$gs" | grep -cx -- '--stale-worktree-timeout=5m'
          yq '.args[]' <<<"$gs" | grep -cx -- '--ssh-known-hosts-file=/etc/git-hosts/known_hosts'
          init=$(yq '.spec.template.spec.initContainers[] | select(.name=="git-sync-init")' <<<"$dep")
          yq '.args[]' <<<"$init" | grep -cx -- '--one-time'
          ! yq '.args[]' <<<"$init" | grep -c -- '--period'
          main=$(yq '.spec.template.spec.containers[] | select(.name=="main")' <<<"$dep")
          [ "$(yq '.command | join(" ")' <<<"$main")" = "/sbin/tini -g -- sh -ec" ]
          yq '.args[0]' <<<"$main" | grep -c "exec pnpm dev --legacy-watch --watch /workspace/git/app --exec 'sh -c \"cd /workspace/git/app && exec node src/main.js\"'"
          yq '.args[0]' <<<"$main" | grep -c 'ln -sfn /app/node_modules /workspace/node_modules'
          echo "SSH key projected only into git-sync containers, only the one key"
          [ "$(yq '.spec.template.spec.volumes[] | select(.name=="git-sync-ssh") | .secret.secretName' <<<"$dep")" = "app-secrets" ]
          [ "$(yq '.spec.template.spec.volumes[] | select(.name=="git-sync-ssh") | .secret.items[0].key' <<<"$dep")" = "myapp-git-sync-ssh" ]
          [ "$(yq '.spec.template.spec.volumes[] | select(.name=="git-sync-ssh") | .secret.defaultMode' <<<"$dep")" = "288" ]
          [ "$(yq '.volumeMounts[] | select(.name=="git-sync-ssh") | .mountPath' <<<"$main")" = "" ]
          [ "$(yq '.volumeMounts[] | select(.name=="git-sync-ssh") | .mountPath' <<<"$gs")" = "/etc/git-secret" ]
          [ "$(yq '.volumeMounts[] | select(.name=="workspace") | .mountPath' <<<"$main")" = "/workspace" ]
          echo "main container env untouched by hot reload"
          [ "$(yq '.env[] | select(.name=="db__connection__database") | .value' <<<"$main")" = '$(APP_NAME)_preview_$(GITHUB_PR_NUMBER)' ]
          echo "APP_NAME / GITHUB_PR_NUMBER injected into every container, sorted before consumers"
          [ "$(yq '.env[0].name + " " + .env[1].name' <<<"$main")" = "APP_NAME GITHUB_PR_NUMBER" ]
          [ "$(yq '.env[] | select(.name=="APP_NAME") | .valueFrom.fieldRef.fieldPath' <<<"$main")" = "metadata.namespace" ]
          [ "$(yq '.spec.template.spec.initContainers[] | select(.name=="migrate") | .env[] | select(.name=="GITHUB_PR_NUMBER") | .valueFrom.fieldRef.fieldPath' <<<"$dep")" = "metadata.labels['pull-request']" ]
          [ "$(yq -N 'select(.kind=="ConfigMap") | .metadata.name' "$f" | sort | tr '\n' ' ')" = "myapp-config myapp-git-sync-hosts " ]
          [ "$(yq 'select(.kind=="HTTPRoute") | .spec.hostnames[0]' "$f")" = "myapp-__GITHUB_PR_NUMBER__.ghostinfra.net" ]

      - name: Check preview database rendering
        run: |
          set -euo pipefail
          echo "disabled by default: no Jobs in minimal, staging or production"
          for f in out/minimal.yaml out/app-db-secrets.yaml out/myapp-staging.yaml out/myapp-production.yaml; do
            ! grep -q 'kind: Job' "$f"
          done

          echo "preview: create + drop Jobs"
          f=out/myapp-preview.yaml
          [ "$(yq -N 'select(.kind=="Job") | .metadata.name' "$f" | sort | tr '\n' ' ')" = "myapp-create-preview-db myapp-drop-preview-db " ]
          create=$(yq 'select(.kind=="Job" and .metadata.name=="myapp-create-preview-db")' "$f")
          drop=$(yq 'select(.kind=="Job" and .metadata.name=="myapp-drop-preview-db")' "$f")
          echo "create: wave 0, Force+Replace, not a hook"
          [ "$(yq '.metadata.annotations["argocd.argoproj.io/sync-wave"]' <<<"$create")" = "0" ]
          [ "$(yq '.metadata.annotations["argocd.argoproj.io/sync-options"]' <<<"$create")" = "Force=true,Replace=true" ]
          [ "$(yq '.metadata.annotations["argocd.argoproj.io/hook"]' <<<"$create")" = "null" ]
          echo "drop: PostDelete hook, deleted on success"
          [ "$(yq '.metadata.annotations["argocd.argoproj.io/hook"]' <<<"$drop")" = "PostDelete" ]
          [ "$(yq '.metadata.annotations["argocd.argoproj.io/hook-delete-policy"]' <<<"$drop")" = "HookSucceeded" ]
          [ "$(yq '.metadata.annotations["argocd.argoproj.io/sync-wave"]' <<<"$drop")" = "null" ]
          for job in "$create" "$drop"; do
            [ "$(yq '.spec.backoffLimit' <<<"$job")" = "2" ]
            [ "$(yq '.spec.ttlSecondsAfterFinished' <<<"$job")" = "3600" ]
            [ "$(yq '.spec.template.spec.restartPolicy' <<<"$job")" = "Never" ]
            [ "$(yq '.spec.template.spec.containers[0].image' <<<"$job")" = "mysql:8.4" ]
            [ "$(yq '.spec.template.spec.containers[0].env[] | select(.name=="DB_HOST") | .valueFrom.secretKeyRef | .name + "/" + .key' <<<"$job")" = "app-db-secrets/host" ]
            [ "$(yq '.spec.template.spec.containers[0].env[] | select(.name=="DB_PASS") | .valueFrom.secretKeyRef | .name + "/" + .key' <<<"$job")" = "app-db-secrets/password" ]
            [ "$(yq '.spec.template.spec.containers[0].env[] | select(.name=="APP_NAME") | .valueFrom.fieldRef.fieldPath' <<<"$job")" = "metadata.namespace" ]
            [ "$(yq '.spec.template.spec.containers[0].env[] | select(.name=="GITHUB_PR_NUMBER") | .valueFrom.fieldRef.fieldPath' <<<"$job")" = "metadata.labels['pull-request']" ]
            yq '.spec.template.spec.containers[0].command[2]' <<<"$job" | grep -cF "case \"\$GITHUB_PR_NUMBER\" in '' | *[!0-9]*)"
          done
          yq '.spec.template.spec.containers[0].command[2]' <<<"$create" | grep -cF 'CREATE DATABASE IF NOT EXISTS \`${APP_NAME}_preview_${GITHUB_PR_NUMBER}\` CHARACTER SET utf8mb4'
          yq '.spec.template.spec.containers[0].command[2]' <<<"$drop" | grep -cF 'DROP DATABASE IF EXISTS \`${APP_NAME}_preview_${GITHUB_PR_NUMBER}\`'

          echo "custom secret name and label"
          c=$(helm template myapp "$CHART" -n myapp -f examples/myapp/values.yaml -f examples/myapp/values.preview.yaml \
                --set previewDatabase.secretName=other-db --set previewDatabase.keys.password=pw --set previewDatabase.pullRequestLabel=pr \
              | yq 'select(.kind=="Job" and .metadata.name=="myapp-create-preview-db") | .spec.template.spec.containers[0].env')
          [ "$(yq '.[] | select(.name=="DB_USER") | .valueFrom.secretKeyRef.name' <<<"$c")" = "other-db" ]
          [ "$(yq '.[] | select(.name=="DB_PASS") | .valueFrom.secretKeyRef.key' <<<"$c")" = "pw" ]
          [ "$(yq '.[] | select(.name=="GITHUB_PR_NUMBER") | .valueFrom.fieldRef.fieldPath' <<<"$c")" = "metadata.labels['pr']" ]


  version-bump:
    name: Chart version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a new, unreleased version when the chart changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE" HEAD -- "$CHART"; then
            echo "no changes under $CHART"; exit 0
          fi
          old=$(git show "$BASE:$CHART/Chart.yaml" 2>/dev/null | yq '.version' || echo none)
          new=$(yq '.version' "$CHART/Chart.yaml")
          echo "base=$old head=$new"
          if [ "$old" = "$new" ]; then
            echo "::error file=$CHART/Chart.yaml::$CHART changed but version is still $new. Bump 'version' (releases are immutable; every releasable change needs a new version)." >&2
            exit 1
          fi
          if gh release view "ghost-app-$new" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error file=$CHART/Chart.yaml::ghost-app-$new is already released and releases are never overwritten. Pick a new version." >&2
            exit 1
          fi
