# Lint, render and check the charts. Runs on every PR and push to main, and is
# reused by release.yaml so nothing is published that did not pass.
#
# Rendered snapshots (charts/k8s-app/tests/snapshots/, regenerated by scripts/regen.sh)
# prove the templates produce the expected manifests; they do not prove the
# workloads run. See README "Validation".
name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CHART: charts/k8s-app
  # Pinned so local and CI results match; Renovate does not manage this line.
  HELM_VERSION: v4.1.4

jobs:
  lint-and-render:
    name: Lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Build dependencies from Chart.lock
        run: |
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
          # Fails if Chart.yaml and Chart.lock disagree (run `helm dependency update` and commit the lock)
          helm dependency build "$CHART"
          ls "$CHART/charts"

      - name: Lint with every example
        env:
          EX: examples/k8s-app
        run: |
          set -x
          helm lint --strict "$CHART"
          for env in staging production; do
            helm lint --strict "$CHART" -f "$EX/values.base.yaml" -f "$EX/values.$env.yaml"
          done
          helm lint --strict "$CHART" -f "$EX/values.base.yaml" -f "$EX/values.preview.yaml" --set preview.prNumber=123

      - name: Schema rejects invalid values
        env:
          EX: examples/k8s-app
        run: |
          set -x
          base="-f $EX/values.base.yaml"
          ! helm template t "$CHART" $base --set secretsInjection.bogus=1
          ! helm template t "$CHART" $base --set secretsInjection.store.kind=Nope
          ! helm template t "$CHART" $base --set hotReload.enabled=true --set hotReload.controller=nope  # unknown controller
          ! helm template t "$CHART" $base --set controllers.main.bogus=1  # bjw-s schema still applies
          ! helm template t "$CHART" $base --set previewDatabase.bogus=1
          ! helm template t "$CHART" $base --set previewDatabase.backoffLimit=-1
          ! helm template t "$CHART" $base --set route.main.gateway=bogus  # selector is an enum
          ! helm template t "$CHART" $base --set gateway.bogus=1

      - name: Derived files are up to date (schema + rendered snapshots)
        # scripts/regen.sh rebuilds values.schema.json, the README values tables and tests/snapshots/;
        # a chart change must commit its regenerated output. The snapshot diff
        # in a PR is the exact manifest change every app will see.
        run: |
          ./scripts/regen.sh
          git add -N "$CHART/tests/snapshots"   # so new snapshot files show up in the diff too
          if ! git diff --exit-code --stat -- "$CHART/values.schema.json" "$CHART/README.md" "$CHART/tests/snapshots"; then
            echo "::error::Derived files are stale. Run scripts/regen.sh and commit the result." >&2
            exit 1
          fi

      - name: Invariants the snapshots cannot express
        # Everything shape-related lives in tests/snapshots/. These are the
        # cross-cutting rules that must hold for any values, not one render.
        env:
          EX: examples/k8s-app
        run: |
          set -euo pipefail
          r="$CHART/tests/snapshots"
          echo "no Kustomize placeholder survives; ESO expressions reach the manifest untouched"
          ! grep -rq REPLACED-BY-KUSTOMIZE "$r"
          grep -q "host: '{{ (.db | fromJson).private_host }}'" "$r/staging.yaml"
          echo "secretsInjection is opt-in and injects nothing: disabled renders no ExternalSecret, enabled adds no envFrom"
          ! helm template t "$CHART" -f "$EX/values.base.yaml" --set secretsInjection.enabled=false --set secretsInjection.database=false | grep -q 'kind: ExternalSecret'
          ! helm template t "$CHART" -f "$EX/values.base.yaml" --set secretsInjection.database=false | grep -q 'name: app-db-secrets$'
          [ "$(yq 'select(.kind=="Deployment") | .spec.template.spec.containers[0].envFrom[] | select(.secretRef != null) | .secretRef.name' "$r/staging.yaml")" = "" ]
          echo "hot reload leaves the app container's env alone and touches only its command/args"
          [ "$(yq 'select(.kind=="Deployment") | .spec.template.spec.containers[] | select(.name=="main") | .env[] | select(.name=="db__connection__database") | .value' "$r/preview.yaml")" = '$(APP_NAME)_preview_$(GITHUB_PR_NUMBER)' ]
          echo "the SSH deploy key is mounted only into git-sync containers"
          [ "$(yq 'select(.kind=="Deployment") | .spec.template.spec.containers[] | select(.name=="main") | .volumeMounts[] | select(.name=="git-sync-ssh") | .name' "$r/preview.yaml")" = "" ]
          echo "explicit hotReload.repo / .ref override the derived values"
          ov=$(helm template myapp "$CHART" -n myapp -f "$EX/values.base.yaml" -f "$EX/values.preview.yaml" --set preview.prNumber=123 \
                 --set hotReload.repo=git@github.com:TryGhost/Daisy.js.git --set hotReload.ref=refs/heads/main \
               | yq 'select(.kind=="Deployment") | .spec.template.spec.containers[] | select(.name=="git-sync")')
          yq '.args[]' <<<"$ov" | grep -cx -- '--repo=git@github.com:TryGhost/Daisy.js.git'
          [ "$(yq '.env[] | select(.name=="GITSYNC_REF") | .value' <<<"$ov")" = "refs/heads/main" ]
          echo "previewDatabase reads a custom Secret / key when told to"
          c=$(helm template myapp "$CHART" -n myapp -f "$EX/values.base.yaml" -f "$EX/values.preview.yaml" --set preview.prNumber=123 \
                --set previewDatabase.secretName=other-db --set previewDatabase.keys.password=pw \
              | yq 'select(.kind=="Job" and .metadata.name=="myapp-create-preview-db") | .spec.template.spec.containers[0].env')
          [ "$(yq '.[] | select(.name=="DB_USER") | .valueFrom.secretKeyRef.name' <<<"$c")" = "other-db" ]
          [ "$(yq '.[] | select(.name=="DB_PASS") | .valueFrom.secretKeyRef.key' <<<"$c")" = "pw" ]
          echo "route parentRefs are filled from the gateway selector (shared-internal default in the snapshots)"
          [ "$(yq 'select(.kind=="HTTPRoute") | .spec.parentRefs[0].name' "$r/staging.yaml")" = "shared-internal-gateway" ]
          echo "dedicated gateways render Gateway + Certificate + redirect, and are refused on previews"
          d=$(helm template myapp "$CHART" -n myapp -f "$EX/values.base.yaml" -f "$EX/values.staging.yaml" --set route.main.gateway=dedicated-external)
          yq 'select(.kind=="Gateway") | .metadata.name' <<<"$d" | grep -qx myapp-gateway-external
          yq 'select(.kind=="Gateway") | .spec.infrastructure.annotations["service.beta.kubernetes.io/do-loadbalancer-network"]' <<<"$d" | grep -qx null
          yq 'select(.kind=="Certificate") | .spec.dnsNames[0]' <<<"$d" | grep -qx myapp.ghostinfra.net
          yq 'select(.kind=="HTTPRoute" and .metadata.name=="myapp-gateway-external-https-redirect") | .spec.rules[0].filters[0].type' <<<"$d" | grep -qx RequestRedirect
          yq 'select(.kind=="HTTPRoute" and .metadata.name=="myapp") | .spec.parentRefs[0].name' <<<"$d" | grep -qx myapp-gateway-external
          ! helm template myapp "$CHART" -n myapp -f "$EX/values.base.yaml" -f "$EX/values.preview.yaml" --set preview.prNumber=123 --set route.main.gateway=dedicated-internal
          echo "expected images come from chart defaults (Renovate bumps must not need assertion edits)"
          [ "$(yq 'select(.kind=="Deployment") | .spec.template.spec.containers[] | select(.name=="git-sync") | .image' "$r/preview.yaml")" = "$(yq '.hotReload.gitSync.image.repository + ":" + .hotReload.gitSync.image.tag' "$CHART/values.yaml")" ]

  version-bump:
    name: Chart version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a new, unreleased version when the chart changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE" HEAD -- "$CHART"; then
            echo "no changes under $CHART"; exit 0
          fi
          old=$(git show "$BASE:$CHART/Chart.yaml" 2>/dev/null | yq '.version' || echo none)
          new=$(yq '.version' "$CHART/Chart.yaml")
          echo "base=$old head=$new"
          if [ "$old" = "$new" ]; then
            echo "::error file=$CHART/Chart.yaml::$CHART changed but version is still $new. Bump 'version' (releases are immutable; every releasable change needs a new version)." >&2
            exit 1
          fi
          if gh release view "k8s-app-$new" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error file=$CHART/Chart.yaml::k8s-app-$new is already released and releases are never overwritten. Pick a new version." >&2
            exit 1
          fi
