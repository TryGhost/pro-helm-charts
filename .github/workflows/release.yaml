# Package and publish charts to the GitHub Pages Helm repository
# https://tryghost.github.io/pro-helm-charts
#
# Trigger: a push to main that touches charts/**. For every chart whose
# Chart.yaml version has no GitHub release yet, this job bundles the locked
# dependencies, packages, creates the release <chart>-<version> with the .tgz
# attached (assets are uploaded at creation, so this works with GitHub's
# immutable releases), and merges the entry into index.yaml on gh-pages,
# pointing at the release asset. Released versions are skipped, never
# overwritten (validate.yaml's version-bump job blocks PRs that would try).
#
# helm/chart-releaser is not used: it uploads assets after creating the
# release, which immutable releases reject.
#
# The gh-pages push uses GITHUB_TOKEN, so it triggers no further Actions
# workflows. GitHub's own Pages build (pages-build-deployment) is not an
# Actions workflow and still runs, so index.yaml goes live within a minute
# or two.
name: release

on:
  push:
    branches: [main]
    paths:
      - charts/**
      - .github/workflows/release.yaml
      - .github/workflows/validate.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  HELM_VERSION: v4.1.4

jobs:
  validate:
    uses: ./.github/workflows/validate.yaml
    permissions:
      contents: read

  release:
    name: Package and publish
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases and tags, push gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Ensure the gh-pages branch exists
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "gh-pages exists"; exit 0
          fi
          git switch --orphan gh-pages
          git commit --allow-empty -m "Initialise Helm repository index branch"
          git push origin gh-pages
          git checkout --force "$GITHUB_REF_NAME"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package and release unreleased chart versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
          git fetch --depth=1 origin gh-pages
          git worktree add gh-pages origin/gh-pages
          [ -f gh-pages/index.yaml ] || printf 'apiVersion: v1\nentries: {}\n' > gh-pages/index.yaml
          released=()
          for dir in charts/*/; do
            name=$(yq '.name' "$dir/Chart.yaml")
            version=$(yq '.version' "$dir/Chart.yaml")
            tag="$name-$version"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$tag already released, skipping (releases are immutable)"
              continue
            fi
            # Bundle the exact dependency versions from Chart.lock so consumers
            # never need the bjw-s repository.
            helm dependency build "$dir"
            pkgdir=".cr-release-packages/$name"
            mkdir -p "$pkgdir"
            helm package "$dir" --destination "$pkgdir"
            gh release create "$tag" "$pkgdir/$tag.tgz" \
              --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
            # Merge the new entry into index.yaml; the download URL is the release asset.
            helm repo index "$pkgdir" \
              --url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag" \
              --merge gh-pages/index.yaml
            cp "$pkgdir/index.yaml" gh-pages/index.yaml
            released+=("$tag")
          done
          if [ ${#released[@]} -eq 0 ]; then
            echo "nothing to release"; exit 0
          fi
          cd gh-pages
          git add index.yaml
          git commit -m "Release ${released[*]}"
          git push origin HEAD:gh-pages
          echo "published: ${released[*]}"
