# Package and publish charts to the GitHub Pages Helm repository
# (https://tryghost.github.io/pro-helm-charts) with helm/chart-releaser.
#
# Trigger: a push to main that touches charts/**. chart-releaser diffs
# charts/ against the latest release tag, packages every chart whose
# directory changed, creates a GitHub release + tag <chart>-<version> with the
# .tgz attached, and rewrites index.yaml on the gh-pages branch, keeping
# every previous entry. `skip_existing` means an already-released version is
# never overwritten; validate.yaml's version-bump job blocks PRs that would
# try.
#
# The gh-pages push uses GITHUB_TOKEN, so it triggers no further Actions
# workflows. GitHub's own Pages build (pages-build-deployment) is not an
# Actions workflow and still runs, so index.yaml goes live within a minute
# or two.
name: release

on:
  push:
    branches: [main]
    paths:
      - charts/**
      - .github/workflows/release.yaml
      - .github/workflows/validate.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  HELM_VERSION: v4.1.4

jobs:
  validate:
    uses: ./.github/workflows/validate.yaml
    permissions:
      contents: read

  release:
    name: Package and publish
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag, push gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # chart-releaser diffs against the latest tag

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Ensure the gh-pages branch exists
        # chart-releaser pushes index.yaml to gh-pages and fails if the branch
        # is missing. Create an empty orphan branch on first run.
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "gh-pages exists"; exit 0
          fi
          git switch --orphan gh-pages
          git commit --allow-empty -m "Initialise Helm repository index branch"
          git push origin gh-pages
          git switch -

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Bundle the locked common dependency
        # helm package includes charts/*.tgz, so each release ships the exact
        # common version from Chart.lock and apps never need the bjw-s repo.
        run: |
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
          for chart in charts/*/; do
            helm dependency build "$chart"
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          pages_branch: gh-pages
          skip_existing: true
          mark_as_latest: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_GENERATE_RELEASE_NOTES: "true"
