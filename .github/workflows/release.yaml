# Package and publish charts as OCI artifacts to GHCR:
#   oci://ghcr.io/tryghost/charts/<chart>:<version>
#
# Trigger: a push to main that touches charts/**. For every chart whose
# Chart.yaml version has no GitHub release yet, this job bundles the locked
# dependencies, packages, pushes to GHCR and creates the release
# <chart>-<version> with the .tgz attached. Versions that already have a
# release are skipped, never overwritten (validate.yaml's version-bump job
# blocks PRs that would try).
#
# The source repository can stay private: package visibility on GHCR is
# independent, and is set to public once, by hand, after the first push
# (see README "Publishing the first release"). Consumers then pull
# anonymously.
name: release

on:
  push:
    branches: [main]
    paths:
      - charts/**
      - .github/workflows/release.yaml
      - .github/workflows/validate.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  HELM_VERSION: v4.1.4
  OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  validate:
    uses: ./.github/workflows/validate.yaml
    permissions:
      contents: read

  release:
    name: Package and publish
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Package and push unreleased chart versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
          oci_repo=$(tr 'A-Z' 'a-z' <<<"$OCI_REPO")   # GHCR paths are lowercase
          mkdir -p .cr-release-packages
          for dir in charts/*/; do
            name=$(yq '.name' "$dir/Chart.yaml")
            version=$(yq '.version' "$dir/Chart.yaml")
            tag="$name-$version"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$tag already released, skipping (releases are immutable)"
              continue
            fi
            if helm show chart "$oci_repo/$name" --version "$version" >/dev/null 2>&1; then
              echo "::error::$oci_repo/$name:$version exists on GHCR but has no GitHub release; refusing to overwrite. Bump the version." >&2
              exit 1
            fi
            # Bundle the exact dependency versions from Chart.lock so consumers
            # never need the bjw-s repository.
            helm dependency build "$dir"
            helm package "$dir" --destination .cr-release-packages
            pkg=".cr-release-packages/$tag.tgz"
            helm push "$pkg" "$oci_repo"
            gh release create "$tag" "$pkg" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes \
              --notes "Chart: \`$oci_repo/$name:$version\` (\`helm pull $oci_repo/$name --version $version\`)"
            echo "released $tag -> $oci_repo/$name:$version"
          done
